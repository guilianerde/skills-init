name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash:
    name: bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shell: /bin/bash   # macOS 自带 bash 3.2
          - os: ubuntu-latest
            shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bash tests
        run: ${{ matrix.shell }} tests/test-init-skills.sh
      - name: Run node tests
        run: node --test "tests/*.mjs"

  pwsh:
    name: pwsh (windows-latest, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # 多覆盖一个 Node 版本：0.6.0 的 EISDIR 报错出现在用户的 Windows 环境，CI 的 Node 22 没复现
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run PowerShell tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-init-skills.ps1
      - name: Run node tests
        run: node --test "tests/*.mjs"
