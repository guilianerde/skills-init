name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: node 22 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run node tests
        run: node --test "tests/*.mjs"

  windows:
    name: node ${{ matrix.node }} (windows-latest)
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # 多覆盖一个 Node 版本：0.6.0 的 EISDIR 报错出现在用户的 Windows 环境，CI 的 Node 22 没复现
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run node tests
        run: node --test "tests/*.mjs"
